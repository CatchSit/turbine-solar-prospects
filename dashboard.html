<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Turbine Energy — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f8f9fa; --surface: #ffffff; --surface2: #eef1ec;
  --border: rgba(17,24,39,0.12); --borderH: rgba(17,24,39,0.18);
  --text: #111827; --text2: #6b7280; --text3: rgba(17,24,39,0.38);
  --accent: #2ba45e; --accentDim: rgba(43,164,94,0.12); --accentDk: #1f8a52;
  --warn: #c08438; --warnSoft: #f3e3cb; --alert: #b85544; --alertSoft: #f0d3ce;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
#top-nav { background: var(--surface); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; }
.nav-brand { font-weight: 600; font-size: 15px; }
.nav-brand-sub { font-size: 11.5px; color: var(--text3); margin-left: 6px; }
#sign-out-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; color: var(--text2); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-map-link { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; color: var(--text2); text-decoration: none; }
.nav-map-link:hover { background: var(--surface2); color: var(--text); text-decoration: none; }
#wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
.period-row { display: flex; gap: 8px; margin-bottom: 18px; }
.period-btn { padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; color: var(--text2); }
.period-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.chart-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.table-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.table-header h2 { font-size: 14px; }
.filters { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.filters select, .filters input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; background: var(--surface2); }
#export-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; }
#grant-area-rows select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; background: var(--surface2); font-family: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; padding: 10px 16px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
th .sort-ind { color: var(--accent); }
td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
.outcome-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 100px; font-size: 11px; }
.outcome-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
#empty-state, #denied-state { text-align: center; padding: 60px 20px; color: var(--text3); }
</style>
</head>
<body>

<div id="top-nav">
  <div><span class="nav-brand">Turbine Energy</span><span class="nav-brand-sub">Dashboard</span></div>
  <div class="nav-right">
    <a class="nav-map-link" href="index.html">Map</a>
    <a class="nav-map-link" href="crm.html">CRM</a>
    <button id="sign-out-btn">Sign out</button>
  </div>
</div>

<div id="wrap" style="display:none">
  <div class="table-card" style="margin-bottom:18px">
    <div class="table-header"><h2>Grant funding by area</h2></div>
    <div id="grant-area-rows" style="padding:12px 16px; display:flex; flex-direction:column; gap:10px"></div>
  </div>

  <div class="table-card" style="margin-bottom:18px">
    <div class="table-header"><h2>Solar enrichment</h2></div>
    <div style="padding:12px 16px; display:flex; flex-direction:column; gap:10px">
      <div id="enrich-area-list" style="display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px;"></div>
      <div style="display:flex; align-items:center; gap:10px">
        <button class="period-btn" id="enrich-run-btn">Run enrichment</button>
        <button class="period-btn" id="enrich-stop-btn" style="display:none">Stop</button>
        <span id="enrich-status" style="font-size:12.5px; color:var(--text2)"></span>
      </div>
      <div id="enrich-log" style="font-size:11.5px; color:var(--text3); font-family:monospace; white-space:pre-wrap; max-height:160px; overflow-y:auto"></div>
    </div>
  </div>

  <div class="period-row">
    <button class="period-btn active" data-period="week">7 days</button>
    <button class="period-btn" data-period="month">30 days</button>
    <button class="period-btn" data-period="all">All time</button>
  </div>

  <div class="charts-row">
    <div class="chart-card"><h3>Daily activity</h3><canvas id="chart-activity" style="max-height:220px"></canvas></div>
    <div class="chart-card"><h3>By employee</h3><canvas id="chart-employee" style="max-height:220px"></canvas></div>
  </div>

  <div class="table-card">
    <div class="table-header"><h2>Contact log</h2><button id="export-btn">Export CSV</button></div>
    <div class="filters">
      <select id="f-employee"><option value="">All employees</option></select>
      <select id="f-outcome"><option value="">All outcomes</option></select>
      <input type="text" id="f-search" placeholder="Search prospect address…"/>
    </div>
    <table>
      <thead><tr>
        <th data-col="contacted_at"><span class="th-label">Date</span><span class="sort-ind"></span></th>
        <th data-col="prospect_address"><span class="th-label">Prospect</span><span class="sort-ind"></span></th>
        <th data-col="employee"><span class="th-label">Employee</span><span class="sort-ind"></span></th>
        <th data-col="outcome"><span class="th-label">Outcome</span><span class="sort-ind"></span></th>
        <th data-col="follow_up_date"><span class="th-label">Follow-up</span><span class="sort-ind"></span></th>
        <th data-col="notes"><span class="th-label">Notes</span><span class="sort-ind"></span></th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-state" style="display:none">No contacts logged yet.</div>
  </div>
</div>

<div id="denied-state" style="display:none">This page is restricted to managers.</div>

<script src="shared/escape-html.js"></script>
<script src="shared/contact-outcome-config.js"></script>
<script src="shared/grant-area-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://gkvropheqktytghmiwgp.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdnJvcGhlcWt0eXRnaG1pd2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjg2NjAsImV4cCI6MjEwMTUwNDY2MH0.swu4sPPi2X9fS-DQEh-cW-ypWZqbWNHXLnGHaKWMxI8'
);

const ADMIN_EMAILS = ['greg@turbineenergyuk.co.uk'];
function isAdmin(user) { return ADMIN_EMAILS.includes((user?.email || '').toLowerCase()); }

let allData = [];
let currentUser = null;
let prospectNames = {};
let activePeriod = 'week';
let activeCharts = {};
let sortState = { col: 'contacted_at', asc: false };

// Stable grouping key for "by employee" — groups by employee_email (the
// account-tied identifier) rather than the free-text employee name, since
// the display name is just whatever a rep typed/had pre-filled. Falls back
// to the name itself for any legacy row logged before employee_email was
// consistently populated.
function employeeKey(c) { return c.employee_email || c.employee; }

async function boot(user) {
  if (!isAdmin(user)) {
    document.getElementById('denied-state').style.display = 'block';
    return;
  }
  currentUser = user;
  document.getElementById('wrap').style.display = 'block';
  await loadData();
  populateFilters();
  setupSorting();
  buildCharts();
  renderTable();
  renderGrantAreas();
  initEnrichPanel();
}

/* ── Solar enrichment runner ─────────────────────────────────
   Calls the solar-enrichment Edge Function (deployed 2026-09-10 with
   optional {"areas":[...]} targeting) repeatedly, using this page's own
   real signed-in manager session, until either no 'pending' rows remain
   for the selected area(s) or the monthly budget is exhausted. Runs here
   (not via a script) because the function requires a real
   @turbineenergyuk.co.uk session — no service-role/admin bypass exists
   for it by design (see the function's own auth check). */
let enrichRunning = false;
function initEnrichPanel() {
  const list = document.getElementById('enrich-area-list');
  const preselected = ['Doncaster', 'Sheffield']; // the areas with funding currently available
  GRANT_AREA_NAMED.forEach(area => {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex; align-items:center; gap:6px; cursor:pointer;';
    label.innerHTML = `<input type="checkbox" value="${area}" class="enrich-area-cb" ${preselected.includes(area) ? 'checked' : ''}> ${area}`;
    list.appendChild(label);
  });
}

document.getElementById('enrich-run-btn').addEventListener('click', async () => {
  const areas = [...document.querySelectorAll('.enrich-area-cb:checked')].map(cb => cb.value);
  if (!areas.length) { alert('Pick at least one area.'); return; }

  enrichRunning = true;
  document.getElementById('enrich-run-btn').style.display = 'none';
  document.getElementById('enrich-stop-btn').style.display = '';
  const logEl = document.getElementById('enrich-log');
  const statusEl = document.getElementById('enrich-status');
  logEl.textContent = '';

  const totals = { prospect: 0, has_solar: 0, no_coverage: 0, error: 0 };
  let batchNum = 0;
  const MAX_BATCHES = 100; // safety cap against a runaway loop

  while (enrichRunning && batchNum < MAX_BATCHES) {
    batchNum++;
    statusEl.textContent = `Running batch ${batchNum}…`;
    const { data, error } = await db.functions.invoke('solar-enrichment', { body: { areas } });

    if (error) {
      // supabase-js's error.message is a generic "non-2xx status code" —
      // the real reason is in the response body, reachable via
      // error.context (the raw Response) for a FunctionsHttpError. Surface
      // it so a failure is diagnosable from this log instead of needing
      // server-side function logs (2026-09-10, first real run failed with
      // only the generic message visible).
      let detail = error.message;
      try {
        if (error.context && typeof error.context.json === 'function') {
          const body = await error.context.clone().json();
          detail = `HTTP ${error.context.status} — ${JSON.stringify(body)}`;
        }
      } catch { /* body wasn't JSON — fall back to the generic message */ }
      logEl.textContent += `Batch ${batchNum}: error — ${detail}\n`;
      break;
    }
    if (data.error) {
      logEl.textContent += `Batch ${batchNum}: error — ${JSON.stringify(data.error)}\n`;
      break;
    }
    if (data.budgetExhausted) {
      logEl.textContent += `Batch ${batchNum}: monthly Solar API budget exhausted (${data.usedThisPeriod}/${data.monthlyCap}). Stopping.\n`;
      break;
    }

    totals.prospect += data.prospect || 0;
    totals.has_solar += data.has_solar || 0;
    totals.no_coverage += data.no_coverage || 0;
    totals.error += data.error || 0;
    logEl.textContent += `Batch ${batchNum}: processed ${data.processed} (prospect=${data.prospect} has_solar=${data.has_solar} no_coverage=${data.no_coverage} error=${data.error}) — budget used ${data.usedThisPeriod}/${data.monthlyCap}\n`;
    logEl.scrollTop = logEl.scrollHeight;

    if (!data.processed) {
      logEl.textContent += `Done — no pending rows left in the selected area(s).\n`;
      break;
    }
  }

  enrichRunning = false;
  document.getElementById('enrich-run-btn').style.display = '';
  document.getElementById('enrich-stop-btn').style.display = 'none';
  statusEl.textContent = `Finished: ${totals.prospect} prospect, ${totals.has_solar} has_solar, ${totals.no_coverage} no_coverage, ${totals.error} error (${batchNum} batch${batchNum === 1 ? '' : 'es'}).`;
});

document.getElementById('enrich-stop-btn').addEventListener('click', () => { enrichRunning = false; });

// Manager-only status toggle per grant-tracked local authority — read by
// index.html to shade the map's boundary overlay and colour the sidebar's
// area-filter chips (shared/grant-area-config.js, migration 016).
async function renderGrantAreas() {
  const el = document.getElementById('grant-area-rows');
  const { data, error } = await db.from('grant_areas').select('local_authority, status');
  if (error) { console.error('grant_areas fetch failed (has migration 016 been run?):', error); return; }
  const statusByArea = {};
  (data || []).forEach(row => { statusByArea[row.local_authority] = row.status; });

  GRANT_AREA_NAMED.forEach(area => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:12px;';
    const select = document.createElement('select');
    GRANT_STATUS_ORDER.forEach(status => {
      const opt = document.createElement('option');
      opt.value = status;
      opt.textContent = GRANT_STATUS[status].label;
      if (statusByArea[area] === status) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', async () => {
      const { error: updateError } = await db.from('grant_areas').update({
        status: select.value,
        updated_at: new Date().toISOString(),
        updated_by_email: currentUser.email,
      }).eq('local_authority', area);
      if (updateError) { console.error('grant_areas update failed:', updateError); alert('Failed to update status — see console.'); }
    });
    row.innerHTML = `<span style="font-weight:500">${escapeHtml(area)}</span>`;
    row.appendChild(select);
    el.appendChild(row);
  });
}

document.getElementById('sign-out-btn').addEventListener('click', async () => { await db.auth.signOut(); location.href = 'index.html'; });

db.auth.getSession().then(({ data: { session } }) => {
  if (session?.user) boot(session.user);
  else location.href = 'index.html';
});

// PostgREST caps unpaginated results at 1000 rows — page past it explicitly,
// mirroring index.html's fetchAllProspects() pattern.
const PAGE_SIZE = 1000;

async function fetchAllContacts() {
  const rows = [];
  let from = 0;
  while (true) {
    const { data, error } = await db
      .from('prospect_contacts')
      .select('*')
      .is('deleted_at', null)
      .order('contacted_at', { ascending: false })
      .range(from, from + PAGE_SIZE - 1);
    if (error) { console.error('Failed to load prospect_contacts:', error); return null; }
    rows.push(...data);
    if (data.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }
  return rows;
}

async function fetchProspectsByIds(ids) {
  const rows = [];
  let from = 0;
  while (true) {
    const { data, error } = await db
      .from('prospects')
      .select('id, address, postcode')
      .in('id', ids)
      .order('id', { ascending: true })
      .range(from, from + PAGE_SIZE - 1);
    if (error) { console.error('Failed to load prospects:', error); return rows; }
    rows.push(...(data || []));
    if (data.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }
  return rows;
}

async function loadData() {
  const contacts = await fetchAllContacts();
  allData = contacts || [];

  const ids = [...new Set(allData.map(c => c.prospect_id))];
  if (ids.length) {
    const prospects = await fetchProspectsByIds(ids);
    prospects.forEach(p => { prospectNames[p.id] = p.address || p.postcode || 'Unknown'; });
  }
}

function periodData() {
  if (activePeriod === 'all') return allData;
  const days = activePeriod === 'week' ? 7 : 30;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  // Align to a calendar-day boundary so this matches the daily-activity
  // chart's calendar-date bucketing exactly — otherwise a rolling
  // now-minus-N-days cutoff and N-calendar-dates of buckets can disagree
  // by up to a day, and the employee/activity charts won't sum to the
  // same total for the same period selection.
  cutoff.setHours(0, 0, 0, 0);
  return allData.filter(c => new Date(c.contacted_at) >= cutoff);
}

function populateFilters() {
  const empByKey = new Map();
  allData.forEach(c => { const key = employeeKey(c); if (!empByKey.has(key)) empByKey.set(key, c.employee); });
  const empSel = document.getElementById('f-employee');
  [...empByKey.entries()].sort((a, b) => (a[1] || '').localeCompare(b[1] || '')).forEach(([key, name]) => {
    const opt = document.createElement('option'); opt.value = key; opt.textContent = name; empSel.appendChild(opt);
  });

  const outSel = document.getElementById('f-outcome');
  CONTACT_OUTCOME_ORDER.forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = CONTACT_OUTCOME[o].label; outSel.appendChild(opt); });

  [empSel, outSel].forEach(el => el.addEventListener('change', renderTable));
  document.getElementById('f-search').addEventListener('input', renderTable);
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activePeriod = btn.dataset.period;
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildCharts();
      renderTable();
    });
  });
}

function setupSorting() {
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortState.col === col) sortState.asc = !sortState.asc;
      else { sortState.col = col; sortState.asc = true; }
      renderTable();
    });
  });
}

function updateSortIndicators() {
  document.querySelectorAll('th[data-col]').forEach(th => {
    const ind = th.querySelector('.sort-ind');
    ind.textContent = th.dataset.col === sortState.col ? (sortState.asc ? ' ▲' : ' ▼') : '';
  });
}

function buildCharts() {
  const pd = periodData();

  const dateKeys = [], labels = [], values = [];
  if (activePeriod === 'all') {
    const months = [...new Set(allData.map(c => c.contacted_at.slice(0,7)))].sort();
    months.forEach(m => { dateKeys.push(m); labels.push(new Date(m + '-02').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' })); values.push(0); });
    allData.forEach(c => { const i = dateKeys.indexOf(c.contacted_at.slice(0,7)); if (i >= 0) values[i]++; });
  } else {
    const days = activePeriod === 'week' ? 7 : 30;
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      dateKeys.push(d.toISOString().slice(0,10));
      labels.push(d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }));
      values.push(0);
    }
    allData.forEach(c => { const i = dateKeys.indexOf(c.contacted_at.slice(0,10)); if (i >= 0) values[i]++; });
  }

  if (activeCharts.activity) activeCharts.activity.destroy();
  activeCharts.activity = new Chart(document.getElementById('chart-activity'), {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: '#2ba45e', borderRadius: 4, maxBarThickness: 22 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } }
  });

  const empCounts = {};
  pd.forEach(c => {
    const key = employeeKey(c);
    if (!empCounts[key]) empCounts[key] = { label: c.employee, count: 0 };
    empCounts[key].count++;
  });
  const sorted = Object.values(empCounts).sort((a, b) => b.count - a.count);
  if (activeCharts.employee) activeCharts.employee.destroy();
  activeCharts.employee = new Chart(document.getElementById('chart-employee'), {
    type: 'bar',
    data: { labels: sorted.map(e => e.label), datasets: [{ data: sorted.map(e => e.count), backgroundColor: '#1f8a52', borderRadius: 6, maxBarThickness: 20 }] },
    options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } }
  });
}

function filteredRows() {
  const emp = document.getElementById('f-employee').value;
  const outcome = document.getElementById('f-outcome').value;
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  return periodData().filter(c => {
    if (emp && employeeKey(c) !== emp) return false;
    if (outcome && c.outcome !== outcome) return false;
    if (search && !(prospectNames[c.prospect_id] || '').toLowerCase().includes(search)) return false;
    return true;
  });
}

function sortRows(rows) {
  const { col, asc } = sortState;
  const dir = asc ? 1 : -1;
  return [...rows].sort((a, b) => {
    let av, bv;
    switch (col) {
      case 'contacted_at':
      case 'follow_up_date':
        av = a[col] ? new Date(a[col]).getTime() : -Infinity;
        bv = b[col] ? new Date(b[col]).getTime() : -Infinity;
        break;
      case 'prospect_address':
        av = (prospectNames[a.prospect_id] || '').toLowerCase();
        bv = (prospectNames[b.prospect_id] || '').toLowerCase();
        break;
      case 'outcome':
        av = (CONTACT_OUTCOME[a.outcome]?.label || a.outcome || '').toLowerCase();
        bv = (CONTACT_OUTCOME[b.outcome]?.label || b.outcome || '').toLowerCase();
        break;
      case 'employee':
      case 'notes':
        av = (a[col] || '').toLowerCase();
        bv = (b[col] || '').toLowerCase();
        break;
      default:
        av = a[col]; bv = b[col];
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function renderTable() {
  const rows = sortRows(filteredRows());
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  updateSortIndicators();

  const emptyState = document.getElementById('empty-state');
  emptyState.style.display = rows.length ? 'none' : 'block';
  emptyState.textContent = allData.length === 0
    ? 'No contacts logged yet.'
    : 'No contacts match the current filters.';

  rows.forEach(c => {
    const cfg = CONTACT_OUTCOME[c.outcome] || { color: '#999', label: c.outcome };
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${new Date(c.contacted_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</td>
      <td>${escapeHtml(prospectNames[c.prospect_id] || 'Unknown')}</td>
      <td>${escapeHtml(c.employee)}</td>
      <td><span class="outcome-tag" style="background:${cfg.color}22;color:${cfg.color}"><span class="dot" style="background:${cfg.color}"></span>${escapeHtml(cfg.label)}</span></td>
      <td>${c.follow_up_date ? new Date(c.follow_up_date).toLocaleDateString('en-GB') : ''}</td>
      <td>${escapeHtml(c.notes || '')}</td>`;
    tbody.appendChild(tr);
  });
}

// Quotes a CSV cell and guards against formula injection: a leading
// =, +, -, @, tab, or CR opens a formula-execution context when the file
// is opened in Excel/Sheets — this matters for ordinary note-taking too
// (e.g. a rep writing "- called, no answer"), not just adversarial input.
function csvCell(value) {
  let s = value === null || value === undefined ? '' : String(value);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return `"${s.replace(/"/g, '""')}"`;
}

document.getElementById('export-btn').addEventListener('click', () => {
  const rows = sortRows(filteredRows());
  const header = ['Date', 'Prospect', 'Employee', 'Outcome', 'Notes', 'Next Action', 'Follow-up Date'];
  const csvRows = rows.map(r => [
    r.contacted_at || '',
    prospectNames[r.prospect_id] || 'Unknown',
    r.employee || '',
    CONTACT_OUTCOME[r.outcome]?.label || r.outcome || '',
    r.notes || '',
    r.next_action || '',
    r.follow_up_date || '',
  ].map(csvCell).join(','));
  const csv = [header.map(csvCell).join(','), ...csvRows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: `turbine-contacts-${new Date().toISOString().slice(0,10)}.csv` }).click();
  URL.revokeObjectURL(url);
});
</script>
